<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>屏风式四子棋</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{
    overflow:hidden;
    color:#eef5ff;
    background:
        radial-gradient(circle at 12% 15%,rgba(72,139,255,.22),transparent 32%),
        radial-gradient(circle at 88% 82%,rgba(31,94,206,.20),transparent 34%),
        radial-gradient(circle at 50% 100%,rgba(26,66,135,.20),transparent 38%),
        linear-gradient(135deg,#050e20,#091a37 48%,#040b19);
}
button{font:inherit;cursor:pointer;border:0}
.screen{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}
.hidden{display:none!important}
.panel{
    position:relative;
    width:min(92vw,530px);
    padding:42px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    background:linear-gradient(145deg,rgba(19,43,82,.76),rgba(5,19,43,.72));
    backdrop-filter:blur(28px);
    box-shadow:0 35px 100px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.08);
}
.panel:before{
    content:"";
    position:absolute;
    left:15%;
    top:0;
    width:70%;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(125,190,255,.8),transparent);
}
.logo{
    width:82px;
    height:82px;
    margin:0 auto 22px;
    border-radius:25px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    font-weight:800;
    background:
        radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),transparent 35%),
        linear-gradient(145deg,#1b55a1,#0a2a5e);
    border:1px solid rgba(145,202,255,.25);
    box-shadow:0 15px 40px rgba(17,74,157,.32),inset 0 1px rgba(255,255,255,.16);
}
h1{
    margin:0 0 10px;
    text-align:center;
    font-size:31px;
    letter-spacing:3px;
}
.subtitle{
    margin:0 0 34px;
    text-align:center;
    color:#9fb5d7;
    font-size:14px;
}
.choice-title{
    margin-bottom:13px;
    color:#b9cae5;
    font-size:14px;
}
.choices{display:flex;gap:12px;margin-bottom:18px}
.choice{
    flex:1;
    padding:16px 10px;
    color:#c9d8ee;
    border:1px solid rgba(255,255,255,.10);
    border-radius:17px;
    background:rgba(255,255,255,.045);
    transition:.2s;
}
.choice:hover{background:rgba(255,255,255,.08)}
.choice.active{
    color:#fff;
    border-color:rgba(91,169,255,.72);
    background:linear-gradient(145deg,rgba(49,125,225,.28),rgba(24,71,143,.20));
    box-shadow:0 0 30px rgba(50,128,226,.16),inset 0 1px rgba(255,255,255,.08);
}
.start{
    width:100%;
    padding:16px;
    border-radius:17px;
    color:#fff;
    font-weight:650;
    letter-spacing:1px;
    background:linear-gradient(135deg,#428ff4,#2457b2);
    box-shadow:0 12px 30px rgba(35,89,181,.32),inset 0 1px rgba(255,255,255,.18);
    transition:.2s;
}
.start:hover{transform:translateY(-1px);filter:brightness(1.08)}
.topbar{
    position:absolute;
    top:18px;
    left:20px;
    right:20px;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.top-title{
    font-size:17px;
    font-weight:650;
    letter-spacing:1px;
    color:#e9f2ff;
}
.top-actions{display:flex;gap:9px}
.icon-btn{
    width:42px;
    height:42px;
    border-radius:13px;
    color:#dce8fa;
    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.09);
    transition:.2s;
}
.icon-btn:hover{background:rgba(255,255,255,.11)}
.game-wrap{
    width:min(94vw,650px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:13px;
}
.status{
    min-height:26px;
    color:#bcd0ed;
    font-size:15px;
    letter-spacing:.3px;
    text-shadow:0 2px 15px rgba(0,0,0,.35);
}
.board-shell{
    position:relative;
    padding:13px;
    border-radius:27px;
    background:
        linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
    border:1px solid rgba(255,255,255,.13);
    box-shadow:
        0 30px 90px rgba(0,0,0,.48),
        0 0 55px rgba(23,92,184,.12),
        inset 0 1px rgba(255,255,255,.12);
}
.board-shell:after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:23px;
    border:1px solid rgba(255,255,255,.035);
    pointer-events:none;
}
canvas{
    display:block;
    width:min(88vw,500px);
    height:auto;
    touch-action:none;
    border-radius:18px;
}
.legend{
    display:flex;
    gap:30px;
    color:#9fb2d1;
    font-size:13px;
}
.legend span{display:flex;align-items:center;gap:8px}
.dot{
    width:13px;
    height:13px;
    border-radius:50%;
    box-shadow:0 0 12px rgba(255,255,255,.12);
}
.dot.red{background:linear-gradient(145deg,#ff7180,#d92d40)}
.dot.yellow{background:linear-gradient(145deg,#ffe980,#e2ad25)}
.modal{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(2,8,20,.62);
    backdrop-filter:blur(10px);
}
.modal-card{
    width:min(90vw,440px);
    padding:34px;
    text-align:center;
    border-radius:26px;
    background:linear-gradient(145deg,rgba(20,43,80,.95),rgba(7,21,44,.96));
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 30px 90px rgba(0,0,0,.55);
}
.modal-card h2{margin:0 0 14px}
.modal-card p{
    margin:0 0 25px;
    line-height:1.85;
    color:#b8c8e0;
    white-space:pre-line;
}
.modal-card button{
    width:100%;
    padding:14px;
    border-radius:14px;
    color:#fff;
    background:linear-gradient(135deg,#347bdc,#2557aa);
}
@media(max-width:600px){
    .panel{padding:30px 23px}
    h1{font-size:27px}
    .top-title{font-size:15px}
    .board-shell{padding:9px;border-radius:22px}
}
</style>
</head>
<body>

<div id="home" class="screen">
    <div class="panel">
        <div class="logo">四</div>
        <h1>屏风式四子棋</h1>
        <p class="subtitle">Advanced Bitboard Search AI</p>
        <div class="choice-title">选择你的先后手</div>
        <div class="choices">
            <button id="firstBtn" class="choice active">我先手</button>
            <button id="secondBtn" class="choice">我后手</button>
        </div>
        <button id="startBtn" class="start">开始对局</button>
    </div>
</div>

<div id="game" class="screen hidden">
    <div class="topbar">
        <div class="top-title">屏风式四子棋</div>
        <div class="top-actions">
            <button id="rulesBtnGame" class="icon-btn">?</button>
            <button id="restartBtn" class="icon-btn">↻</button>
        </div>
    </div>
    <div class="game-wrap">
        <div id="status" class="status">准备开始</div>
        <div class="board-shell">
            <canvas id="board"></canvas>
        </div>
        <div class="legend">
            <span><i class="dot red"></i>你</span>
            <span><i class="dot yellow"></i>AI</span>
        </div>
    </div>
</div>

<div id="rulesModal" class="modal hidden">
    <div class="modal-card">
        <h2>游戏规则</h2>
        <p>棋盘为 7×6。
双方轮流将棋子落入列中，棋子会落到该列最低的空位。
率先形成横、竖或斜向连续四子的玩家获胜。

AI 使用位棋盘、Negamax、
Alpha-Beta、迭代加深、置换表、
强制着法、双威胁检测和启发式排序。</p>
        <button id="closeRules">知道了</button>
    </div>
</div>

<div id="resultModal" class="modal hidden">
    <div class="modal-card">
        <h2 id="resultTitle">对局结束</h2>
        <p id="resultText"></p>
        <button id="resultOk">确定</button>
    </div>
</div>

<script>
"use strict";

const ROWS=6;
const COLS=7;
const HUMAN=1;
const AI_PLAYER=2;
const EMPTY=0;

const CELL_SIZE=68;
const PADDING=15;
const BOARD_W=PADDING*2+COLS*CELL_SIZE;
const BOARD_H=PADDING*2+ROWS*CELL_SIZE;

const canvas=document.getElementById("board");
canvas.width=BOARD_W;
canvas.height=BOARD_H;

const ctx=canvas.getContext("2d");

let humanFirst=true;
let board=[];
let currentPlayer=HUMAN;
let gameOver=false;
let hoverCol=-1;
let aiThinking=false;
let gameVersion=0;
let lastMove=null;

document.getElementById("firstBtn").onclick=()=>{
    humanFirst=true;
    document.getElementById("firstBtn").classList.add("active");
    document.getElementById("secondBtn").classList.remove("active");
};

document.getElementById("secondBtn").onclick=()=>{
    humanFirst=false;
    document.getElementById("secondBtn").classList.add("active");
    document.getElementById("firstBtn").classList.remove("active");
};

document.getElementById("startBtn").onclick=startGame;

document.getElementById("restartBtn").onclick=()=>{
    gameVersion++;
    document.getElementById("game").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");
};

document.getElementById("rulesBtnGame").onclick=()=>{
    document.getElementById("rulesModal").classList.remove("hidden");
};

document.getElementById("closeRules").onclick=()=>{
    document.getElementById("rulesModal").classList.add("hidden");
};

document.getElementById("resultOk").onclick=()=>{
    document.getElementById("resultModal").classList.add("hidden");
    document.getElementById("game").classList.add("hidden");
    document.getElementById("home").classList.remove("hidden");
};

function emptyBoard(){
    return Array.from({length:ROWS},()=>Array(COLS).fill(EMPTY));
}

function startGame(){
    gameVersion++;
    board=emptyBoard();
    gameOver=false;
    hoverCol=-1;
    aiThinking=false;
    lastMove=null;
    currentPlayer=humanFirst?HUMAN:AI_PLAYER;

    document.getElementById("home").classList.add("hidden");
    document.getElementById("game").classList.remove("hidden");

    updateStatus();
    drawBoard();

    if(currentPlayer===AI_PLAYER){
        const version=gameVersion;
        setTimeout(()=>aiTurn(version),100);
    }
}

function updateStatus(){
    const s=document.getElementById("status");
    if(gameOver)return;
    if(aiThinking)s.textContent="AI 正在计算最佳着法……";
    else if(currentPlayer===HUMAN)s.textContent="轮到你";
    else s.textContent="AI 回合";
}

function drawBoard(){
    ctx.clearRect(0,0,BOARD_W,BOARD_H);

    const bg=ctx.createLinearGradient(0,0,BOARD_W,BOARD_H);
    bg.addColorStop(0,"#19539d");
    bg.addColorStop(.5,"#0d3774");
    bg.addColorStop(1,"#092756");

    ctx.fillStyle=bg;
    roundRect(ctx,0,0,BOARD_W,BOARD_H,20);
    ctx.fill();

    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            const x=PADDING+c*CELL_SIZE+CELL_SIZE/2;
            const y=PADDING+(ROWS-1-r)*CELL_SIZE+CELL_SIZE/2;

            ctx.beginPath();
            ctx.arc(x,y,25,0,Math.PI*2);

            ctx.fillStyle="rgba(1,10,27,.56)";
            ctx.fill();

            ctx.strokeStyle="rgba(255,255,255,.055)";
            ctx.lineWidth=1;
            ctx.stroke();

            if(board[r][c]===HUMAN){
                drawPiece(x,y,false,lastMove&&lastMove[0]===r&&lastMove[1]===c);
            }else if(board[r][c]===AI_PLAYER){
                drawPiece(x,y,true,lastMove&&lastMove[0]===r&&lastMove[1]===c);
            }
        }
    }

    if(!gameOver&&currentPlayer===HUMAN&&!aiThinking&&hoverCol>=0&&hoverCol<COLS){
        const x=PADDING+hoverCol*CELL_SIZE+CELL_SIZE/2;

        ctx.save();
        ctx.setLineDash([5,7]);
        ctx.strokeStyle="rgba(255,255,255,.42)";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(x,PADDING);
        ctx.lineTo(x,PADDING+ROWS*CELL_SIZE);
        ctx.stroke();
        ctx.restore();

        const r=getNextRow(board,hoverCol);

        if(r>=0){
            const y=PADDING+(ROWS-1-r)*CELL_SIZE+CELL_SIZE/2;
            ctx.beginPath();
            ctx.arc(x,y,25,0,Math.PI*2);
            ctx.fillStyle="rgba(255,100,112,.24)";
            ctx.fill();
            ctx.strokeStyle="rgba(255,130,140,.25)";
            ctx.stroke();
        }
    }
}

function drawPiece(x,y,ai,highlight){
    ctx.save();

    ctx.shadowBlur=18;
    ctx.shadowColor=ai?"rgba(255,210,70,.38)":"rgba(255,55,75,.35)";

    const g=ctx.createRadialGradient(x-8,y-9,3,x,y,26);

    if(ai){
        g.addColorStop(0,"#fff5a9");
        g.addColorStop(.35,"#ffe36b");
        g.addColorStop(1,"#dca721");
    }else{
        g.addColorStop(0,"#ff9ba3");
        g.addColorStop(.35,"#ff596a");
        g.addColorStop(1,"#d22e43");
    }

    ctx.beginPath();
    ctx.arc(x,y,24,0,Math.PI*2);
    ctx.fillStyle=g;
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.beginPath();
    ctx.arc(x-8,y-9,7,0,Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,.23)";
    ctx.fill();

    if(highlight){
        ctx.beginPath();
        ctx.arc(x,y,27,0,Math.PI*2);
        ctx.strokeStyle="rgba(255,255,255,.75)";
        ctx.lineWidth=2;
        ctx.stroke();
    }

    ctx.restore();
}

function roundRect(c,x,y,w,h,r){
    c.beginPath();
    c.moveTo(x+r,y);
    c.arcTo(x+w,y,x+w,y+h,r);
    c.arcTo(x+w,y+h,x,y+h,r);
    c.arcTo(x,y+h,x,y,r);
    c.arcTo(x,y,x+w,y,r);
    c.closePath();
}

function getNextRow(b,col){
    for(let r=0;r<ROWS;r++){
        if(b[r][col]===EMPTY)return r;
    }
    return -1;
}

function checkWinArray(b,p){
    for(let r=0;r<ROWS;r++){
        for(let c=0;c<COLS;c++){
            if(b[r][c]!==p)continue;

            if(c+3<COLS&&b[r][c+1]===p&&b[r][c+2]===p&&b[r][c+3]===p)return true;
            if(r+3<ROWS&&b[r+1][c]===p&&b[r+2][c]===p&&b[r+3][c]===p)return true;
            if(c+3<COLS&&r+3<ROWS&&b[r+1][c+1]===p&&b[r+2][c+2]===p&&b[r+3][c+3]===p)return true;
            if(c+3<COLS&&r-3>=0&&b[r-1][c+1]===p&&b[r-2][c+2]===p&&b[r-3][c+3]===p)return true;
        }
    }
    return false;
}

function boardFull(b){
    for(let c=0;c<COLS;c++){
        if(b[ROWS-1][c]===EMPTY)return false;
    }
    return true;
}

function makeMove(col,p){
    const r=getNextRow(board,col);
    if(r<0)return false;

    board[r][col]=p;
    lastMove=[r,col];

    if(checkWinArray(board,p)){
        gameOver=true;
        aiThinking=false;
        drawBoard();
        showResult(
            p===HUMAN?"你赢了":"AI赢了",
            p===HUMAN?"漂亮！你连成了四子。":"AI 找到了获胜路线。"
        );
        return true;
    }

    if(boardFull(board)){
        gameOver=true;
        aiThinking=false;
        drawBoard();
        showResult("平局","棋盘已经填满。");
        return true;
    }

    currentPlayer=p===HUMAN?AI_PLAYER:HUMAN;
    aiThinking=false;

    updateStatus();
    drawBoard();

    if(currentPlayer===AI_PLAYER){
        const version=gameVersion;
        setTimeout(()=>aiTurn(version),70);
    }

    return true;
}

function showResult(title,text){
    document.getElementById("resultTitle").textContent=title;
    document.getElementById("resultText").textContent=text;
    document.getElementById("resultModal").classList.remove("hidden");
}

canvas.addEventListener("pointermove",e=>{
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(BOARD_W/rect.width);
    const c=Math.floor((x-PADDING)/CELL_SIZE);

    hoverCol=c>=0&&c<COLS?c:-1;
    drawBoard();
});

canvas.addEventListener("pointerleave",()=>{
    hoverCol=-1;
    drawBoard();
});

canvas.addEventListener("pointerdown",e=>{
    if(gameOver||aiThinking||currentPlayer!==HUMAN)return;

    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)*(BOARD_W/rect.width);
    const c=Math.floor((x-PADDING)/CELL_SIZE);

    if(c>=0&&c<COLS)makeMove(c,HUMAN);
});


class BitBoard{
    constructor(P=0n,M=0n){
        this.P=P;
        this.M=M;
    }

    static fromArray(b,side){
        let P=0n;
        let M=0n;

        for(let c=0;c<COLS;c++){
            for(let r=0;r<ROWS;r++){
                if(b[r][c]===EMPTY)continue;

                const bit=1n<<BigInt(c*7+r);
                M|=bit;

                if(b[r][c]===side)P|=bit;
            }
        }

        return new BitBoard(P,M);
    }

    static bottom(c){
        return 1n<<BigInt(c*7);
    }

    static columnMask(c){
        return 0x3fn<<BigInt(c*7);
    }

    playedBit(c){
        const bit=(this.M+BitBoard.bottom(c))&BitBoard.columnMask(c);
        return bit;
    }

    legalMoves(){
        const res=[];

        for(let c=0;c<COLS;c++){
            if(this.playedBit(c)!==0n)res.push(c);
        }

        return res;
    }

    move(c){
        const bit=this.playedBit(c);

        if(bit===0n)return null;

        const opponent=this.M^this.P;

        return new BitBoard(
            opponent,
            this.M|bit
        );
    }

    winAfter(c){
        const bit=this.playedBit(c);

        if(bit===0n)return false;

        return hasWon(this.P|bit);
    }

    isFull(){
        for(let c=0;c<COLS;c++){
            if(this.playedBit(c)!==0n)return false;
        }

        return true;
    }

    key(){
        return this.P.toString(16)+"|"+this.M.toString(16);
    }
}

function hasWon(p){
    let x=p&(p>>1n);
    if((x&(x>>2n))!==0n)return true;

    x=p&(p>>7n);
    if((x&(x>>14n))!==0n)return true;

    x=p&(p>>6n);
    if((x&(x>>12n))!==0n)return true;

    x=p&(p>>8n);
    if((x&(x>>16n))!==0n)return true;

    return false;
}


const INF=1000000000;
const MATE=100000000;

const CENTER_ORDER=[3,2,4,1,5,0,6];

const WINDOWS=[];

for(let r=0;r<ROWS;r++){
    for(let c=0;c+3<COLS;c++){
        WINDOWS.push([[r,c],[r,c+1],[r,c+2],[r,c+3]]);
    }
}

for(let r=0;r+3<ROWS;r++){
    for(let c=0;c<COLS;c++){
        WINDOWS.push([[r,c],[r+1,c],[r+2,c],[r+3,c]]);
    }
}

for(let r=0;r+3<ROWS;r++){
    for(let c=0;c+3<COLS;c++){
        WINDOWS.push([[r,c],[r+1,c+1],[r+2,c+2],[r+3,c+3]]);
    }
}

for(let r=3;r<ROWS;r++){
    for(let c=0;c+3<COLS;c++){
        WINDOWS.push([[r,c],[r-1,c+1],[r-2,c+2],[r-3,c+3]]);
    }
}


function countImmediateWins(pos){
    let n=0;

    for(const c of CENTER_ORDER){
        if(pos.winAfter(c))n++;
    }

    return n;
}


class SearchEngine{
    constructor(timeLimit=2850){
        this.timeLimit=timeLimit;
        this.startTime=0;
        this.nodes=0;
        this.stop=false;
        this.bestMove=3;
        this.depthReached=0;

        this.tt=new Map();

        this.killer1=new Int8Array(64);
        this.killer2=new Int8Array(64);

        this.history=new Int32Array(COLS);
    }

    timeout(){
        if((this.nodes&4095)!==0)return this.stop;

        if(performance.now()-this.startTime>=this.timeLimit){
            this.stop=true;
        }

        return this.stop;
    }

    search(root){
        this.startTime=performance.now();
        this.nodes=0;
        this.stop=false;
        this.bestMove=this.initialMove(root);
        this.depthReached=0;

        const legal=root.legalMoves();

        if(legal.length===0)return -1;
        if(legal.length===1)return legal[0];

        const immediate=this.findImmediateWin(root);

        if(immediate>=0)return immediate;

        const forced=this.findForcedDefense(root);

        if(forced>=0){
            this.bestMove=forced;
        }

        let maxDepth=42;

        if(root.M===0n)maxDepth=1;

        for(let depth=1;depth<=maxDepth;depth++){
            const result=this.rootSearch(root,depth);

            if(this.stop)break;

            if(result.move>=0){
                this.bestMove=result.move;
                this.depthReached=depth;
            }

            if(result.score>=MATE-depth||result.score<=-MATE+depth){
                break;
            }
        }

        if(this.bestMove<0||root.playedBit(this.bestMove)===0n){
            return legal[0];
        }

        return this.bestMove;
    }

    initialMove(root){
        if(root.M===0n)return 3;

        const legal=root.legalMoves();

        if(legal.includes(3))return 3;
        return legal[0];
    }

    findImmediateWin(pos){
        for(const c of CENTER_ORDER){
            if(pos.winAfter(c))return c;
        }

        return -1;
    }

    findForcedDefense(pos){
        const opponent=new BitBoard(
            pos.M^pos.P,
            pos.M
        );

        const threats=[];

        for(const c of CENTER_ORDER){
            if(opponent.winAfter(c))threats.push(c);
        }

        if(threats.length===1)return threats[0];

        return -1;
    }

    rootSearch(pos,depth){
        const legal=pos.legalMoves();
        const moves=this.orderMoves(pos,legal,0);

        let alpha=-INF;
        const beta=INF;

        let best=-1;
        let bestScore=-INF;

        for(const c of moves){
            if(this.timeout())break;

            const bit=pos.playedBit(c);

            if(bit===0n)continue;

            let score;

            if(hasWon(pos.P|bit)){
                score=MATE;
            }else{
                const child=pos.move(c);
                score=-this.negamax(
                    child,
                    depth-1,
                    -beta,
                    -alpha,
                    1
                );
            }

            if(this.stop)break;

            if(score>bestScore){
                bestScore=score;
                best=c;
            }

            if(score>alpha)alpha=score;
        }

        return {
            move:best,
            score:bestScore
        };
    }

    negamax(pos,depth,alpha,beta,ply){
        this.nodes++;

        if(this.timeout())return 0;

        const legal=pos.legalMoves();

        if(legal.length===0)return 0;

        const key=pos.key();
        const old=this.tt.get(key);

        const originalAlpha=alpha;

        if(old&&old.depth>=depth){
            if(old.flag===0)return old.score;

            if(old.flag===1)alpha=Math.max(alpha,old.score);
            if(old.flag===2)beta=Math.min(beta,old.score);

            if(alpha>=beta)return old.score;
        }

        if(depth<=0){
            const score=this.evaluate(pos);

            this.storeTT(
                key,
                depth,
                score,
                0,
                -1
            );

            return score;
        }

        const ordered=this.orderMoves(pos,legal,ply);

        let value=-INF;
        let bestMove=-1;

        for(const c of ordered){
            if(this.timeout())return 0;

            const bit=pos.playedBit(c);

            if(bit===0n)continue;

            let score;

            if(hasWon(pos.P|bit)){
                score=MATE-ply;
            }else{
                const child=pos.move(c);

                score=-this.negamax(
                    child,
                    depth-1,
                    -beta,
                    -alpha,
                    ply+1
                );
            }

            if(this.stop)return 0;

            if(score>value){
                value=score;
                bestMove=c;
            }

            if(score>alpha){
                alpha=score;
            }

            if(alpha>=beta){
                this.updateKiller(ply,c);
                this.history[c]+=depth*depth;
                break;
            }
        }

        let flag=0;

        if(value<=originalAlpha){
            flag=2;
        }else if(value>=beta){
            flag=1;
        }

        this.storeTT(
            key,
            depth,
            value,
            flag,
            bestMove
        );

        return value;
    }

    storeTT(key,depth,score,flag,move){
        const old=this.tt.get(key);

        if(!old||depth>=old.depth){
            this.tt.set(key,{
                depth,
                score,
                flag,
                move
            });
        }

        if(this.tt.size>180000){
            let n=0;

            for(const k of this.tt.keys()){
                this.tt.delete(k);
                n++;

                if(n>=60000)break;
            }
        }
    }

    updateKiller(ply,c){
        if(this.killer1[ply]!==c){
            this.killer2[ply]=this.killer1[ply];
            this.killer1[ply]=c;
        }
    }

    orderMoves(pos,moves,ply){
        const ttEntry=this.tt.get(pos.key());
        const ttMove=ttEntry?ttEntry.move:-1;

        const result=[];

        const opponent=new BitBoard(
            pos.M^pos.P,
            pos.M
        );

        for(const c of moves){
            let score=0;

            if(c===ttMove)score+=1000000000;

            if(pos.winAfter(c)){
                score+=800000000;
            }

            if(opponent.winAfter(c)){
                score+=300000000;
            }

            const child=pos.move(c);

            if(child){
                const oppThreats=countImmediateWins(
                    child
                );

                if(oppThreats===0)score+=120000;
                if(oppThreats===1)score+=30000;
                if(oppThreats>=2)score-=500000;
            }

            score+=(6-Math.abs(3-c))*10000;
            score+=this.history[c];

            if(this.killer1[ply]===c)score+=700000;
            if(this.killer2[ply]===c)score+=500000;

            result.push([c,score]);
        }

        result.sort((a,b)=>b[1]-a[1]);

        return result.map(x=>x[0]);
    }

    evaluate(pos){
        const me=pos.P;
        const opp=pos.M^pos.P;

        let score=0;

        const centerMask=
            (1n<<3n)|
            (1n<<(7n+3n))|
            (1n<<(14n+3n))|
            (1n<<(21n+3n))|
            (1n<<(28n+3n))|
            (1n<<(35n+3n));

        const meCenter=bitCount(me&centerMask);
        const oppCenter=bitCount(opp&centerMask);

        score+=(meCenter-oppCenter)*80;

        score+=this.evaluateBitWindows(pos,me,opp);

        const mt=countImmediateWins(pos);

        const opponent=new BitBoard(
            opp,
            pos.M
        );

        const ot=countImmediateWins(opponent);

        score+=mt*7000;
        score-=ot*8500;

        if(mt>=2)score+=70000;
        if(ot>=2)score-=90000;

        return Math.max(-INF+1,Math.min(INF-1,score));
    }

    evaluateBitWindows(pos,me,opp){
        const b=arrayFromPosition(pos);
        let score=0;

        for(const w of WINDOWS){
            let a=0;
            let o=0;
            let e=0;

            for(const [r,c] of w){
                if(b[r][c]===1)a++;
                else if(b[r][c]===2)o++;
                else e++;
            }

            if(a>0&&o>0)continue;

            if(a===4)score+=1000000;
            else if(a===3&&e===1)score+=2800;
            else if(a===2&&e===2)score+=250;
            else if(a===1&&e===3)score+=18;

            if(o===4)score-=1000000;
            else if(o===3&&e===1)score-=3200;
            else if(o===2&&e===2)score-=280;
            else if(o===1&&e===3)score-=20;
        }

        return score;
    }
}

function bitCount(x){
    let n=0;

    while(x!==0n){
        x&=x-1n;
        n++;
    }

    return n;
}

function arrayFromPosition(pos){
    const b=emptyBoard();

    for(let c=0;c<COLS;c++){
        for(let r=0;r<ROWS;r++){
            const bit=1n<<BigInt(c*7+r);

            if((pos.M&bit)===0n)continue;

            if((pos.P&bit)!==0n){
                b[r][c]=1;
            }else{
                b[r][c]=2;
            }
        }
    }

    return b;
}


function aiTurn(version){
    if(version!==gameVersion||gameOver||currentPlayer!==AI_PLAYER)return;

    aiThinking=true;
    updateStatus();
    drawBoard();

    setTimeout(()=>{
        if(version!==gameVersion||gameOver||currentPlayer!==AI_PLAYER){
            aiThinking=false;
            return;
        }

        let move=-1;

        try{
            const pos=BitBoard.fromArray(
                board,
                AI_PLAYER
            );

            if(pos.M===0n){
                move=3;
            }else{
                const engine=new SearchEngine(2850);
                move=engine.search(pos);
            }
        }catch(e){
            move=-1;
        }

        if(version!==gameVersion||gameOver||currentPlayer!==AI_PLAYER){
            aiThinking=false;
            return;
        }

        if(move<0||getNextRow(board,move)<0){
            const legal=[];

            for(const c of CENTER_ORDER){
                if(getNextRow(board,c)>=0){
                    legal.push(c);
                }
            }

            if(legal.length===0){
                aiThinking=false;
                return;
            }

            move=legal[0];
        }

        aiThinking=false;
        makeMove(move,AI_PLAYER);
    },20);
}

drawBoard();
